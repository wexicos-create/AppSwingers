name: AppSwinger reliability checks

on:
  push:
    branches: ["main", "repair/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  web-build-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check TypeScript
        run: npm run lint
      - name: Build production bundle
        run: npm run build
