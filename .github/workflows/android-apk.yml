name: Build AppSwinger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - repair/commercial-integrity-security
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: appswinger-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SIGNING_ENABLED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install web and Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Build production web bundle
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Verify Android 15 SDK target
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*35' android/variables.gradle
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*35' android/variables.gradle
          echo "Confirmed compileSdkVersion=35 and targetSdkVersion=35 (Android 15)."

      - name: Build debug APK (automatically signed for testing)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload signed testing APK
        uses: actions/upload-artifact@v4
        with:
          name: AppSwinger-Android15-debug-signed
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release signing configuration when keystore secrets exist
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          test -s android/app/release-key.jks
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs {" not in s:
              s = re.sub(r"android\s*\{", """android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
          """, s, count=1)
          s, count = re.subn(r"(buildTypes\s*\{\s*release\s*\{)", r"\1\n            signingConfig signingConfigs.release", s, count=1)
          if count != 1:
              raise SystemExit("Could not safely add the release signingConfig to the generated Gradle file.")
          p.write_text(s)
          PY

      - name: Build production-signed release APK
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: app/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify and upload production-signed release APK
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload production-signed APK
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: AppSwinger-Android15-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
