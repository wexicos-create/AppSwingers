name: AppSwingers CI

on:
  push:
    branches:
      - main
      - repair/commercial-integrity-security
      - repair/step-1-reliability
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appswingers-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production web build
        run: npm run build
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: TypeScript check for backend
        working-directory: functions
        run: npm run lint
      - name: Compile Firebase Functions
        working-directory: functions
        run: npm run build
