name: AppSwinger CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appswinger-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Build web application
        run: bun run build
