<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Ejemplo ilustrativo de depósito SPEI AppSwinger</title><desc id="desc">Mockup, no es comprobante real ni contiene datos bancarios válidos.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28104e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
<rect width="1080" height="1350" rx="44" fill="#f5f3ff"/><rect width="1080" height="245" rx="44" fill="url(#bg)"/><rect y="200" width="1080" height="45" fill="url(#bg)"/>
<circle cx="96" cy="92" r="42" fill="#c4b5fd"/><path d="M74 93l17 17 29-37" fill="none" stroke="#4c1d95" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="160" y="88" font-family="Arial,sans-serif" font-size="30" fill="#ddd6fe">APPSWINGER · PAGOS MÉXICO</text><text x="64" y="160" font-family="Arial,sans-serif" font-weight="700" font-size="46" fill="#fff">Depósito por transferencia SPEI</text>
<rect x="56" y="280" width="968" height="102" rx="20" fill="#fff1f2" stroke="#ef4444" stroke-width="3"/><text x="86" y="322" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#b91c1c">EJEMPLO ILUSTRATIVO — NO PAGAR A ESTOS DATOS</text><text x="86" y="356" font-family="Arial,sans-serif" font-size="21" fill="#991b1b">Los datos bancarios reales aparecerán al generar una orden válida.</text>
<rect x="56" y="414" width="968" height="500" rx="24" fill="#fff" stroke="#ddd6fe" stroke-width="2"/>
<text x="92" y="475" font-family="Arial,sans-serif" font-size="25" fill="#6b7280">Destino</text><text x="92" y="519" font-family="Arial,sans-serif" font-weight="700" font-size="33" fill="#111827">[BANCO / BENEFICIARIO VERIFICADO]</text><path d="M90 536H988" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
<text x="92" y="597" font-family="Arial,sans-serif" font-size="25" fill="#6b7280">Concepto</text><text x="92" y="641" font-family="Arial,sans-serif" font-weight="700" font-size="35" fill="#111827">ASW-DEM0-000123</text><path d="M90 657H988" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
<text x="92" y="718" font-family="Arial,sans-serif" font-size="25" fill="#6b7280">REFERENCIA</text><text x="92" y="762" font-family="Arial,sans-serif" font-weight="700" font-size="35" fill="#111827">[REFERENCIA DE PRUEBA]</text><path d="M90 778H988" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
<text x="92" y="837" font-family="Arial,sans-serif" font-size="25" fill="#6b7280">Importe de ejemplo</text><text x="92" y="880" font-family="Arial,sans-serif" font-weight="700" font-size="39" fill="#4c1d95">$406.00 MXN · DEMO</text>
<rect x="56" y="948" width="968" height="190" rx="24" fill="#fff" stroke="#d1d5db" stroke-width="2"/><text x="92" y="1001" font-family="Arial,sans-serif" font-weight="700" font-size="28" fill="#111827">Comprobante de transferencia (simulado)</text><rect x="92" y="1028" width="896" height="72" rx="12" fill="#f3f4f6"/><text x="122" y="1072" font-family="Arial,sans-serif" font-size="25" fill="#6b7280">SIN OPERACIÓN REAL · SIN CEP VALIDADO</text>
<text x="64" y="1192" font-family="Arial,sans-serif" font-weight="700" font-size="27" fill="#4c1d95">1. Copia los datos que genere tu orden.</text><text x="64" y="1234" font-family="Arial,sans-serif" font-size="25" fill="#374151">2. Envía la transferencia desde tu banco.</text><text x="64" y="1276" font-family="Arial,sans-serif" font-size="25" fill="#374151">3. Introduce la referencia y espera la revisión del CEP.</text><text x="64" y="1318" font-family="Arial,sans-serif" font-size="19" fill="#6b7280">Nunca se activa una membresía con una captura o referencia no verificada.</text>
</svg>